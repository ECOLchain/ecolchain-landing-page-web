name: CI & Auto-PR (Feature -> Develop)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-pr:
    name: Validate Feature Branch & Auto PR to Develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Run Lint
        run: |
          cd app
          npm run lint

      - name: Run Build Test
        run: |
          cd app
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd app
          DEPLOY_URL=$(vercel deploy --token=$VERCEL_TOKEN --yes)
          echo "PREVIEW_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Vercel Preview URL: $DEPLOY_URL"

      - name: Auto Create or Update PR to Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          PR_BODY="✨ **Preview da Feature gerado na Vercel!**

          🔗 **URL de Preview:** [${{ env.PREVIEW_URL }}](${{ env.PREVIEW_URL }})

          ---
          PR automático gerado pelo pipeline de CI após aprovação nos testes da branch \`$BRANCH_NAME\`."

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR de $BRANCH_NAME para develop..."
            gh pr create \
              --head "$BRANCH_NAME" \
              --base develop \
              --title "feat: $BRANCH_NAME" \
              --body "$PR_BODY"
          else
            echo "Atualizando PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            gh pr comment "$EXISTING_PR" --body "🔄 **Novo Deploy de Preview Atualizado!**\n\n🔗 **URL:** [${{ env.PREVIEW_URL }}](${{ env.PREVIEW_URL }})"
          fi
