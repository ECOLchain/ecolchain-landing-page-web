name: CI & Auto-PR (Feature -> Develop)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-pr:
    name: Validate Feature Branch & Auto PR to Develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Run Lint
        run: |
          cd app
          npm run lint

      - name: Run Build Test
        run: |
          cd app
          npm run build

      - name: Auto Create PR to Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # Verificar se PR já existe
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Criando novo PR de $BRANCH_NAME para develop..."
            gh pr create \
              --head "$BRANCH_NAME" \
              --base develop \
              --title "feat: $BRANCH_NAME" \
              --body "PR automático gerado pelo pipeline de CI após aprovação nos testes da branch \`$BRANCH_NAME\`."
          else
            echo "PR #$EXISTING_PR já existe para $BRANCH_NAME -> develop."
          fi
